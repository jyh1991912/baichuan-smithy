name: Deploy Baichuan Smithy Modular

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          test -f baichuan-app.zip
          unzip -q baichuan-app.zip -d _site
          shopt -s nullglob
          packs=(asset-*.zip)
          for z in "${packs[@]}"; do
            echo "Merging $z"
            unzip -qo "$z" -d _site
          done
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
