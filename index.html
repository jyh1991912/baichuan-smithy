<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a110c">
<title>百川铁匠铺</title>
<style>
html,body{margin:0;height:100%;background:#120c08;color:#f4dfb5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{width:min(92vw,420px);border:3px solid #6d482b;background:#22160e;padding:28px 22px;text-align:center;box-shadow:0 8px 0 #070403}
h1{margin:0 0 14px;font-size:28px;color:#f0c66a}
p{margin:8px 0;line-height:1.7;color:#d5bd95}
.ok{display:inline-block;margin-top:16px;padding:10px 16px;border:2px solid #8c6137;background:#3a2718;color:#ffe29a;font-weight:700}
small{display:block;margin-top:18px;color:#8f7a60}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>百川铁匠铺</h1>
    <p>GitHub Pages 部署测试页</p>
    <div class="ok">✅ 页面已成功上线</div>
    <small>baichuan-smithy · deploy test</small>
  </div>
</div>
</body>
</html>
